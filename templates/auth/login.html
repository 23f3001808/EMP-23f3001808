{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h2 class="text-center mb-1">Examination Management Portal</h2>
    <p class="text-center text-muted mb-4">Admins, examiners and students sign in here.</p>
    <div class="card shadow-sm"><div class="card-body p-4">
      <form method="post">
        <div class="mb-3"><label class="form-label" for="email">Email</label>
          <input class="form-control" id="email" name="email" type="email" required autofocus></div>
        <div class="mb-3"><label class="form-label" for="password">Password</label>
          <input class="form-control" id="password" name="password" type="password" required></div>
        <button class="btn btn-primary w-100">Login</button>
      </form>
      <p class="text-center mt-3 mb-0 small">New user? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
    </div></div>
  </div>
</div>
{% endblock %}
