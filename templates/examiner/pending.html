{% extends 'base.html' %}
{% block title %}Awaiting approval{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6"><div class="card shadow-sm"><div class="card-body text-center p-5">
  <h4>Awaiting admin approval</h4>
  <p class="text-muted">Hello {{ g.user.full_name }}, your examiner account is <strong>{{ g.user.status }}</strong>. You will get access to the dashboard once the administrator approves it.</p>
  <a class="btn btn-outline-secondary" href="{{ url_for('auth.logout') }}">Logout</a>
</div></div></div></div>
{% endblock %}
